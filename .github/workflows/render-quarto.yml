name: Render Quarto site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.0

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev

      - name: Restore renv packages
        if: ${{ hashFiles('renv.lock') != '' }}
        uses: r-lib/actions/setup-renv@v2

      - name: Install R packages from install_packages.R
        if: ${{ hashFiles('renv.lock') == '' && hashFiles('install_packages.R') != '' }}
        shell: Rscript {0}
        run: |
          source("install_packages.R")

      - name: Install minimal R packages
        if: ${{ hashFiles('renv.lock') == '' && hashFiles('install_packages.R') == '' }}
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          pkgs <- c(
            "knitr", "rmarkdown", "dplyr", "tidyr", "readr",
            "ggplot2", "stringr", "purrr", "tibble", "shiny"
          )
          to_install <- setdiff(pkgs, rownames(installed.packages()))
          if (length(to_install) > 0) install.packages(to_install)

      - name: Check Quarto
        run: quarto check

      - name: Render site
        run: quarto render

      - name: Commit rendered site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs _freeze

          if git diff --cached --quiet; then
            echo "No hay cambios para commit"
            exit 0
          fi

          git commit -m "Render site with GitHub Actions"
          git push