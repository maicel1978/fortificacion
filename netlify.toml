[build]
  # Actualizamos a 1.6.1 para que la extensión Quizdown no de error
  command = """
    curl -LO https://github.com/quarto-dev/quarto-cli/releases/download/v1.6.1/quarto-1.6.1-linux-amd64.deb && \
    dpkg -x quarto-1.6.1-linux-amd64.deb . && \
    export PATH=$PWD/opt/quarto/bin:$PATH && \
    quarto render
  """
  publish = "docs"

[build.environment]
  NODE_VERSION = "20"