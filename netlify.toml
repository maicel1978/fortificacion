[build]
  publish = "docs"
  command = """
    QUARTO_VERSION=1.6.0
    curl -LO https://github.com/quarto-dev/quarto-cli/releases/download/v${QUARTO_VERSION}/quarto-${QUARTO_VERSION}-linux-amd64.deb
    dpkg -x quarto-${QUARTO_VERSION}-linux-amd64.deb .
    export PATH=$PWD/opt/quarto/bin:$PATH
    quarto --version
    quarto render
  """

[build.environment]
  NODE_VERSION = "20"